openapi: 3.1.0
info:
  title: yaran org control-plane Worker
  version: "1"
  summary: The org Worker's JSON API, browser navigations and HTML surfaces.
  description: >-
    Phase 02 Design §5 (W1-W32). /v1 is a path prefix, not the protocol version: clients send
    Yaran-Protocol on every request (browser navigations use the v query parameter). Every non-2xx
    JSON response is the §4 ErrorEnvelope; codes are listed per operation in x-error-codes. HTML
    routes render the same codes on an accessible error page. The API sends no CORS headers.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: https://{orgControlPlane}
    description: The org's control-plane hostname (D16 placeholder).
    variables:
      orgControlPlane:
        default: org-control-plane
tags:
  - name: admin
    description: Admin console API (role admin).
  - name: devices
    description: The signed-in user's phones.
  - name: handoff
    description: Sealed handoff for the control plane.
  - name: html
    description: HTML surfaces that are not a JSON contract.
  - name: machine
    description: The Ed25519-signed machine API under the public /v1/machine/* override.
  - name: me
    description: The signed-in user.
  - name: meta
    description: Public metadata.
  - name: pairing
    description: Machine pairing in the browser.
paths:
  /v1/meta:
    get:
      operationId: getMeta
      summary: W1 · Org metadata and protocol range
      description: "W1. Org metadata and protocol range; 200 before and after setup (D19). Cache-Control public, max-age=60."
      tags: [meta]
      security: []
      x-error-codes: [misdirected_host, method_not_allowed, rate_limited, internal, unavailable]
      responses:
        "200":
          description: Success.
          headers:
            Yaran-Protocol: { $ref: "#/components/headers/YaranProtocol" }
            Yaran-Request-Id: { $ref: "#/components/headers/YaranRequestId" }
          content:
            application/json:
              schema: { $ref: "../schemas/meta.schema.json#/$defs/Meta" }
        "405": { $ref: "#/components/responses/Error" }
        "421": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/pair/authorize:
    get:
      operationId: pairAuthorizeStart
      summary: W2 · Show the pairing confirm page
      description: "W2. Browser navigation: renders the pairing confirm page showing the machine key fingerprint, or redirects to the loopback callback with error and state."
      tags: [pairing]
      security: 
        - accessJwt: []
      parameters:
        - $ref: "#/components/parameters/v"
        - name: state
          in: query
          required: true
          description: PairAuthorizeQuery.state.
          schema: { $ref: "../schemas/pairing.schema.json#/$defs/PairAuthorizeQuery/properties/state" }
        - name: code_challenge
          in: query
          required: true
          description: PairAuthorizeQuery.code_challenge.
          schema: { $ref: "../schemas/pairing.schema.json#/$defs/PairAuthorizeQuery/properties/code_challenge" }
        - name: code_challenge_method
          in: query
          required: true
          description: PairAuthorizeQuery.code_challenge_method.
          schema: { $ref: "../schemas/pairing.schema.json#/$defs/PairAuthorizeQuery/properties/code_challenge_method" }
        - name: machine_pubkey
          in: query
          required: true
          description: PairAuthorizeQuery.machine_pubkey.
          schema: { $ref: "../schemas/pairing.schema.json#/$defs/PairAuthorizeQuery/properties/machine_pubkey" }
        - name: machine_name
          in: query
          required: true
          description: PairAuthorizeQuery.machine_name.
          schema: { $ref: "../schemas/pairing.schema.json#/$defs/PairAuthorizeQuery/properties/machine_name" }
        - name: callback
          in: query
          required: true
          description: PairAuthorizeQuery.callback.
          schema: { $ref: "../schemas/pairing.schema.json#/$defs/PairAuthorizeQuery/properties/callback" }
        - name: yaran_version
          in: query
          required: true
          description: PairAuthorizeQuery.yaran_version.
          schema: { $ref: "../schemas/pairing.schema.json#/$defs/PairAuthorizeQuery/properties/yaran_version" }
        - name: origin_port
          in: query
          required: false
          description: PairAuthorizeQuery.origin_port.
          schema: { $ref: "../schemas/pairing.schema.json#/$defs/PairAuthorizeQuery/properties/origin_port" }
      x-error-codes: [pair_request_invalid, pair_callback_invalid, pairing_not_allowed, machine_name_invalid, origin_port_invalid, unauthenticated, service_token_rejected, user_disabled, device_revoked, identity_unavailable, setup_incomplete, misdirected_host, protocol_unsupported, rate_limited, internal, unavailable]
      responses:
        "200": { $ref: "#/components/responses/Html" }
        "302": { $ref: "#/components/responses/CallbackRedirect" }
        "400": { $ref: "#/components/responses/HtmlError" }
        "401": { $ref: "#/components/responses/HtmlError" }
        "403": { $ref: "#/components/responses/HtmlError" }
        "421": { $ref: "#/components/responses/HtmlError" }
        "429": { $ref: "#/components/responses/HtmlError" }
        "500": { $ref: "#/components/responses/HtmlError" }
        "503": { $ref: "#/components/responses/HtmlError" }
    post:
      operationId: pairAuthorizeConsent
      summary: W3 · Answer the pairing confirm page
      description: "W3. Form post from the confirm page; redirects to the callback with code and state, or error and state. The code lives 120 s, single use."
      tags: [pairing]
      security: 
        - accessJwt: []
      parameters:
        - $ref: "#/components/parameters/v"
      x-error-codes: [pair_request_invalid, pair_request_expired, pair_denied, machine_cap_reached, account_quota_reached, hostname_conflict, provisioning_in_progress, provisioning_failed, cloudflare_api_failed, cloudflare_unavailable, cloudflare_rate_limited, cloudflare_permission_denied, origin_mismatch, unsupported_media_type, payload_too_large, bad_request, validation_failed, unauthenticated, service_token_rejected, user_disabled, device_revoked, identity_unavailable, setup_incomplete, misdirected_host, protocol_unsupported, rate_limited, internal, unavailable]
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema: { $ref: "../schemas/pairing.schema.json#/$defs/PairConsent" }
      responses:
        "302": { $ref: "#/components/responses/CallbackRedirect" }
        "400": { $ref: "#/components/responses/HtmlError" }
        "401": { $ref: "#/components/responses/HtmlError" }
        "403": { $ref: "#/components/responses/HtmlError" }
        "409": { $ref: "#/components/responses/HtmlError" }
        "410": { $ref: "#/components/responses/HtmlError" }
        "413": { $ref: "#/components/responses/HtmlError" }
        "415": { $ref: "#/components/responses/HtmlError" }
        "421": { $ref: "#/components/responses/HtmlError" }
        "429": { $ref: "#/components/responses/HtmlError" }
        "500": { $ref: "#/components/responses/HtmlError" }
        "502": { $ref: "#/components/responses/HtmlError" }
        "503": { $ref: "#/components/responses/HtmlError" }
  /v1/machine/claim:
    post:
      operationId: claimMachine
      summary: W4 · Claim a paired machine
      description: "W4. Signed with the key from machine_pubkey; no Yaran-Machine-Id (the key is resolved through the pair code). The response contains the tunnel token."
      tags: [machine]
      security: 
        - machineSignature: []
      parameters:
        - $ref: "#/components/parameters/YaranProtocol"
        - $ref: "#/components/parameters/YaranMachineId"
        - $ref: "#/components/parameters/YaranTimestamp"
        - $ref: "#/components/parameters/YaranNonce"
        - $ref: "#/components/parameters/YaranSignature"
      x-error-codes: [pair_code_invalid, pkce_mismatch, origin_port_invalid, provisioning_failed, provisioning_in_progress, cloudflare_api_failed, cloudflare_unavailable, cloudflare_rate_limited, cloudflare_permission_denied, signature_missing, signature_invalid, signature_expired, nonce_replayed, machine_unknown, machine_revoked, protocol_unsupported, payload_too_large, unsupported_media_type, bad_request, validation_failed, misdirected_host, rate_limited, internal, unavailable]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "../schemas/machine.schema.json#/$defs/ClaimRequest" }
      responses:
        "200":
          description: Success.
          headers:
            Yaran-Protocol: { $ref: "#/components/headers/YaranProtocol" }
            Yaran-Request-Id: { $ref: "#/components/headers/YaranRequestId" }
          content:
            application/json:
              schema: { $ref: "../schemas/machine.schema.json#/$defs/ClaimResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "410": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "421": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/machine/config:
    get:
      operationId: getMachineConfig
      summary: W5 · Machine configuration
      description: "W5. The machine's configuration; never contains the token."
      tags: [machine]
      security: 
        - machineSignature: []
      parameters:
        - $ref: "#/components/parameters/YaranProtocol"
        - $ref: "#/components/parameters/YaranMachineId"
        - $ref: "#/components/parameters/YaranTimestamp"
        - $ref: "#/components/parameters/YaranNonce"
        - $ref: "#/components/parameters/YaranSignature"
      x-error-codes: [machine_not_ready, signature_missing, signature_invalid, signature_expired, nonce_replayed, machine_unknown, machine_revoked, protocol_unsupported, payload_too_large, unsupported_media_type, bad_request, validation_failed, misdirected_host, rate_limited, internal, unavailable]
      responses:
        "200":
          description: Success.
          headers:
            Yaran-Protocol: { $ref: "#/components/headers/YaranProtocol" }
            Yaran-Request-Id: { $ref: "#/components/headers/YaranRequestId" }
          content:
            application/json:
              schema: { $ref: "../schemas/machine.schema.json#/$defs/MachineConfig" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "410": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "421": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/machine/events:
    post:
      operationId: postMachineEvents
      summary: W6 · Report attention and exit events
      description: "W6. A batch of up to 16 attention/exit events, deduped by id for 24 h. Org push off is still 202 with push_enabled false."
      tags: [machine]
      security: 
        - machineSignature: []
      parameters:
        - $ref: "#/components/parameters/YaranProtocol"
        - $ref: "#/components/parameters/YaranMachineId"
        - $ref: "#/components/parameters/YaranTimestamp"
        - $ref: "#/components/parameters/YaranNonce"
        - $ref: "#/components/parameters/YaranSignature"
      x-error-codes: [machine_not_ready, signature_missing, signature_invalid, signature_expired, nonce_replayed, machine_unknown, machine_revoked, protocol_unsupported, payload_too_large, unsupported_media_type, bad_request, validation_failed, misdirected_host, rate_limited, internal, unavailable]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "../schemas/machine.schema.json#/$defs/EventBatch" }
      responses:
        "202":
          description: Success.
          headers:
            Yaran-Protocol: { $ref: "#/components/headers/YaranProtocol" }
            Yaran-Request-Id: { $ref: "#/components/headers/YaranRequestId" }
          content:
            application/json:
              schema: { $ref: "../schemas/machine.schema.json#/$defs/EventBatchResult" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "410": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "421": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/machine/rotate:
    post:
      operationId: rotateMachineToken
      summary: W7 · Rotate or sync the tunnel token
      description: "W7. Rotate the tunnel token now (user) or fetch the current one if newer (sync)."
      tags: [machine]
      security: 
        - machineSignature: []
      parameters:
        - $ref: "#/components/parameters/YaranProtocol"
        - $ref: "#/components/parameters/YaranMachineId"
        - $ref: "#/components/parameters/YaranTimestamp"
        - $ref: "#/components/parameters/YaranNonce"
        - $ref: "#/components/parameters/YaranSignature"
      x-error-codes: [machine_not_ready, provisioning_in_progress, cloudflare_api_failed, cloudflare_unavailable, cloudflare_rate_limited, cloudflare_permission_denied, signature_missing, signature_invalid, signature_expired, nonce_replayed, machine_unknown, machine_revoked, protocol_unsupported, payload_too_large, unsupported_media_type, bad_request, validation_failed, misdirected_host, rate_limited, internal, unavailable]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "../schemas/machine.schema.json#/$defs/RotateRequest" }
      responses:
        "200":
          description: Success.
          headers:
            Yaran-Protocol: { $ref: "#/components/headers/YaranProtocol" }
            Yaran-Request-Id: { $ref: "#/components/headers/YaranRequestId" }
          content:
            application/json:
              schema: { $ref: "../schemas/machine.schema.json#/$defs/RotateResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "410": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "421": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/machine/unpair:
    post:
      operationId: unpairMachine
      summary: W8 · Unpair this machine
      description: "W8. Empty body. Starts the ordered teardown (D21). yaran deletes its credentials on 202 or 410 machine_revoked."
      tags: [machine]
      security: 
        - machineSignature: []
      parameters:
        - $ref: "#/components/parameters/YaranProtocol"
        - $ref: "#/components/parameters/YaranMachineId"
        - $ref: "#/components/parameters/YaranTimestamp"
        - $ref: "#/components/parameters/YaranNonce"
        - $ref: "#/components/parameters/YaranSignature"
      x-error-codes: [provisioning_in_progress, signature_missing, signature_invalid, signature_expired, nonce_replayed, machine_unknown, machine_revoked, protocol_unsupported, payload_too_large, unsupported_media_type, bad_request, validation_failed, misdirected_host, rate_limited, internal, unavailable]
      responses:
        "202":
          description: Success.
          headers:
            Yaran-Protocol: { $ref: "#/components/headers/YaranProtocol" }
            Yaran-Request-Id: { $ref: "#/components/headers/YaranRequestId" }
          content:
            application/json:
              schema: { $ref: "../schemas/machine.schema.json#/$defs/TeardownStarted" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "410": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "421": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/machine/origin:
    put:
      operationId: updateMachineOrigin
      summary: W32 · Update the origin port
      description: "W32. Sent when yaran's serving port changes; the ingress repair runs asynchronously."
      tags: [machine]
      security: 
        - machineSignature: []
      parameters:
        - $ref: "#/components/parameters/YaranProtocol"
        - $ref: "#/components/parameters/YaranMachineId"
        - $ref: "#/components/parameters/YaranTimestamp"
        - $ref: "#/components/parameters/YaranNonce"
        - $ref: "#/components/parameters/YaranSignature"
      x-error-codes: [origin_port_invalid, machine_not_ready, provisioning_in_progress, signature_missing, signature_invalid, signature_expired, nonce_replayed, machine_unknown, machine_revoked, protocol_unsupported, payload_too_large, unsupported_media_type, bad_request, validation_failed, misdirected_host, rate_limited, internal, unavailable]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "../schemas/machine.schema.json#/$defs/OriginUpdate" }
      responses:
