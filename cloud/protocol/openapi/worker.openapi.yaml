        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "421": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/me/machines:
    get:
      operationId: listMyMachines
      summary: W10 · List my machines
      description: "W10. The user's machines with live status from the Cloudflare tunnel list."
      tags: [me]
      security: 
        - accessJwt: []
      parameters:
        - $ref: "#/components/parameters/YaranProtocol"
        - $ref: "#/components/parameters/YaranInstallId"
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
      x-error-codes: [unauthenticated, service_token_rejected, user_disabled, device_revoked, identity_unavailable, setup_incomplete, misdirected_host, protocol_unsupported, rate_limited, internal, unavailable]
