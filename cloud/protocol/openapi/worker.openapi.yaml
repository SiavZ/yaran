        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "410": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "421": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/me:
    get:
      operationId: getMe
      summary: W9 · The signed-in user
      description: "W9. The signed-in user."
      tags: [me]
      security: 
        - accessJwt: []
      parameters:
        - $ref: "#/components/parameters/YaranProtocol"
        - $ref: "#/components/parameters/YaranInstallId"
      x-error-codes: [unauthenticated, service_token_rejected, user_disabled, device_revoked, identity_unavailable, setup_incomplete, misdirected_host, protocol_unsupported, rate_limited, internal, unavailable]
