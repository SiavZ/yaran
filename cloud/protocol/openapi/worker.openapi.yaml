            Yaran-Request-Id: { $ref: "#/components/headers/YaranRequestId" }
          content:
            application/json:
              schema: { $ref: "../schemas/devices.schema.json#/$defs/Device" }
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "../schemas/devices.schema.json#/$defs/Device" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
