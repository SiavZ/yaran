        "503": { $ref: "#/components/responses/Error" }
  /v1/me/devices:
    post:
      operationId: registerDevice
      summary: W12 · Register or update a device
      description: "W12. Upsert by install_id; the Yaran-Install-Id header must equal install_id, and a different device_key for a known install_id is 409 conflict. 201 on create, 200 on update."
      tags: [devices]
      security: 
        - accessJwt: []
      parameters:
        - $ref: "#/components/parameters/YaranProtocol"
        - $ref: "#/components/parameters/YaranInstallId"
      x-error-codes: [device_cap_reached, push_endpoint_invalid, push_relay_disallowed, conflict, origin_mismatch, unsupported_media_type, payload_too_large, bad_request, validation_failed, unauthenticated, service_token_rejected, user_disabled, device_revoked, identity_unavailable, setup_incomplete, misdirected_host, protocol_unsupported, rate_limited, internal, unavailable]
