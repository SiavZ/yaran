components:
  securitySchemes:
    accessJwt:
      type: apiKey
      in: header
      name: Cf-Access-Jwt-Assertion
      description: The control-plane Access app's user JWT, attached by Access and verified by the Worker (iss, aud, exp, non-empty email, not a service token). Native clients present the app token as both the CF_Authorization cookie and the cf-access-token header.
    machineSignature:
      type: apiKey
      in: header
      name: Yaran-Signature
      description: Ed25519 over the Design §7 canonical string, with Yaran-Protocol, Yaran-Machine-Id (absent on claim), Yaran-Timestamp and Yaran-Nonce. Served under the Access public override /v1/machine/*.
  parameters:
    YaranProtocol:
      name: Yaran-Protocol
      in: header
      required: true
      description: The negotiated protocol version (§3).
      schema: { type: integer, minimum: 1 }
    YaranInstallId:
      name: Yaran-Install-Id
      in: header
      required: false
      description: The app's InstallId for this org once registered; a revoked install gets 403 device_revoked.
      schema: { $ref: "../schemas/common.schema.json#/$defs/InstallId" }
    YaranMachineId:
      name: Yaran-Machine-Id
      in: header
      required: false
      description: The machine id; absent only on /v1/machine/claim.
      schema: { $ref: "../schemas/common.schema.json#/$defs/Uuid" }
    YaranTimestamp:
      name: Yaran-Timestamp
      in: header
      required: true
      description: Unix seconds, within 300 s of the server clock.
      schema: { type: string, pattern: '^(?:0|[1-9][0-9]{0,11})$' }
    YaranNonce:
      name: Yaran-Nonce
      in: header
      required: true
      description: 16 random bytes, base64url.
      schema: { type: string, pattern: '^[A-Za-z0-9_-]{21}[AQgw]$' }
    YaranSignature:
      name: Yaran-Signature
      in: header
      required: true
      description: The 64-byte Ed25519 signature, base64url.
      schema: { type: string, pattern: '^[A-Za-z0-9_-]{85}[AQgw]$' }
    v:
      name: v
      in: query
      required: true
      description: Protocol version for a browser navigation.
      schema: { type: integer, minimum: 1 }
    id:
      name: id
      in: path
      required: true
      description: The resource id.
      schema: { $ref: "../schemas/common.schema.json#/$defs/Uuid" }
    limit:
      name: limit
      in: query
      required: false
      description: Page size.
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    cursor:
      name: cursor
      in: query
      required: false
      description: The next_cursor of the previous page.
      schema: { $ref: "../schemas/common.schema.json#/$defs/Cursor" }
  headers:
    YaranProtocol:
      description: The protocol version served.
      schema: { type: integer, minimum: 1 }
    YaranRequestId:
      description: The request id (the CF-Ray value when present), equal to the error envelope's request_id.
      schema: { $ref: "../schemas/common.schema.json#/$defs/RequestId" }
  responses:
    Error:
      description: A §4 error envelope; 429 and 503 carry Retry-After.
      headers:
        Yaran-Request-Id: { $ref: "#/components/headers/YaranRequestId" }
      content:
        application/json:
          schema: { $ref: "../schemas/error.schema.json#/$defs/ErrorEnvelope" }
    HtmlError:
      description: An accessible HTML error page naming the §4 code.
      content:
        text/html:
          schema: { type: string }
    Html:
      description: An HTML page (confirm, consent, wizard or console).
      content:
        text/html:
          schema: { type: string }
    CallbackRedirect:
      description: Redirect to the callback (loopback for pairing, the app callback for handoff) with the success or error parameters.
      headers:
        Location:
          description: The callback URL.
          schema: { type: string }
