[package]
name = "yaran-tui"
version.workspace = true
rust-version.workspace = true
edition = "2024"
# Ships only inside the yaran binary, never on crates.io. cargo-deny keys its
# private-crate exemptions (license, path wildcards) on this.
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
yaran-core.workspace = true
anyhow.workspace = true
# Describes `yaran config` for its help and the reference page; the same version
# the yaran binary parses its command line with.
clap = { version = "4.6.7", features = ["derive"] }
arboard = "3.4.1"
jiff.workspace = true
crossterm = "0.29.0"
home.workspace = true
ratatui = "0.30.0"
serde.workspace = true
serde_json.workspace = true
toml = { version = "1.1.2", features = ["preserve_order"] }
toml_edit = "0.25"
uuid.workspace = true
rustix.workspace = true
signal-hook = "0.4"
similar = "3"
# Wipes a password typed into `yaran config set` from memory once it is used.
zeroize = "1.9"
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "default-themes", "regex-onig"] }
crokey = "1.4.0"
# Reads a raw `CSI … u` key in fullscreen and converts it to crossterm's key
# type; only this crate depends on them.
terminput = "0.5.16"
terminput-crossterm = { version = "0.4.12", default-features = false, features = ["crossterm_0_29"] }
indexmap.workspace = true
# Counts the newlines in a diff side without a byte-at-a-time loop.
memchr = "2.8"
sysinfo.workspace = true
opaline = { version = "0.4", features = ["ratatui", "builtin-themes"] }
# Text is cut and wrapped by extended grapheme cluster, the unit ratatui draws in,
# so an emoji sequence is never split and is measured as one glyph. Pinned to the
# version ratatui already brings in.
unicode-segmentation = "1.13.2"

[dev-dependencies]
# The stand-in `gh` builders live in yaran-core behind `test-support`, so the
# tests here drive the real probe code path against a script whose answer they
# choose. Dev-only: a normal build of this crate leaves the feature off.
yaran-core = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
# `yaran doctor` tests seed and byte-compare a raw database, and other tests
# break the session database through a second connection, the way a disk error
# would. Same version and features as yaran-core, so no new crate enters the build.
rusqlite = { version = "0.41.1", features = ["bundled"] }
# Used only by the signal-disposition regression tests to raise a signal and to
# reproduce the `SIG_DFL` reset the web server deliberately no longer performs.
libc.workspace = true

[lints]
workspace = true
