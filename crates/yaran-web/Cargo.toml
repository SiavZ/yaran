[package]
name = "yaran-web"
version.workspace = true
rust-version.workspace = true
edition = "2024"
# Ships only inside the yaran binary, never on crates.io. cargo-deny keys its
# private-crate exemptions (license, path wildcards) on this.
publish = false

[dependencies]
yaran-core.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
axum.workspace = true
futures-util.workspace = true
# Server-assigned random per-connection ids for status-toast scoping on /ws.
uuid.workspace = true
# Wall-clock `HH:MM:SS` timestamps for the vite-style server console (console.rs).
chrono.workspace = true
# `interpolate-folder-path` is REQUIRED, not a nicety: web_assets.rs embeds
# `$OUT_DIR/ui`, the staged copy build.rs writes, and rust-embed only expands an
# environment variable in `folder` when this feature is on (the expansion is
# feature-gated in rust-embed-impl). Without it the path is taken literally and
# the crate does not compile. It pulls in `shellexpand`, but only as a
# proc-macro-time dependency: nothing from it reaches the runtime binary.
rust-embed = { version = "8", features = [
    "mime-guess",
    "debug-embed",
    "interpolate-folder-path",
] }
# Decompress embedded assets on the fly for the rare client that doesn't accept
# br (build.rs stores them Brotli-compressed to shrink the binary).
brotli = "8"
# Phase 11: CSRF randomness, hashes and the handoff seal's ECDH; already in the lockfile.
ring = "0.17.14"
# Structured logs for the cloud ingress (`yaran::cloud::*` targets).
tracing.workspace = true

# Brotli-compress the built web assets while staging them into $OUT_DIR/ui, so
# rust-embed bakes the compressed bytes into the binary (and they're served with
# Content-Encoding: br). flate2 stays for one legacy job: a checkout whose dist
# was gzipped IN PLACE by an old version of build.rs must be inflated before it
# is recompressed (and the not-built notice detection reads such a dist too).
[build-dependencies]
brotli = "8"
flate2.workspace = true

[dev-dependencies]
# The stand-in `gh` builders live in yaran-core behind `test-support`, so the
# tests here drive the real probe code path against a script whose answer they
# choose. Dev-only: a normal build of this crate leaves the feature off.
yaran-core = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
# `test-util` for the paused clock. The file-drop permit waits up to 30s for a
# slot; a test that proves the wait EXPIRES has to reach the end of it, and
# fast-forwarding an idle runtime is the way to do that without a 30-second
# test or a sleep. Dev-only: the feature is off in a normal build.
tokio = { workspace = true, features = ["test-util"] }
tokio-tungstenite = { workspace = true }
# Captures the cloud ingress logs to prove no secret reaches them.
tracing-subscriber.workspace = true
tower = { version = "0.5", features = ["util"] }
reqwest = { version = "0.12", default-features = false, features = ["cookies", "json"] }
