// machine-view plugin module (:yaran-machine-view in mobile/android): MachineView (bridge-less
// machine WebView) and Session (sealed handoff client, per-host sessions, native org API
// client). The manifest's placeholders (publisherDomain, e2eWebViewDebug) are deliberately NOT
// given values here: a library's own values are substituted before the app merge and would
// override the app's. The app sets them from mobile/publisher.properties, and its manifest
// replaces the callback aliases' literal dev `enabled` values.
apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.android'

def fixturesDir = file('../fixtures').absolutePath
// From the Gradle root (mobile/android): cap sync moves this project under mobile/app/node_modules,
// where a project-relative path no longer reaches the repository's cloud/protocol.
def protocolDir = rootProject.file('../../cloud/protocol').absolutePath

android {
    namespace = "io.github.siavz.yaran.machineview"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlinOptions {
        jvmTarget = '21'
    }
    testOptions {
        unitTests {
            includeAndroidResources = true
            all {
                systemProperty 'machineview.fixtures', fixturesDir
                systemProperty 'machineview.protocol', protocolDir
                systemProperty 'machineview.manifest', file('src/main/AndroidManifest.xml').absolutePath
                // ManifestTest reads this file, so an edit here must rerun it.
                inputs.file('build.gradle')
            }
        }
    }
    lint {
        abortOnError = false
    }
}

// This module's own test manifests are merged like an app's and need values: a dev build's.
androidComponents {
    onVariants(selector().all()) { variant ->
        [variant.unitTest, variant.androidTest].findAll { it != null }.each { test ->
            test.manifestPlaceholders.putAll([
                publisherDomain: '',
                e2eWebViewDebug: 'false',
            ])
        }
    }
}

dependencies {
    implementation project(':yaran-core')
    implementation project(':capacitor-android')
    implementation libs.androidx.appcompat
    implementation libs.androidx.activity
    implementation "androidx.browser:browser:1.10.0"
    implementation "androidx.webkit:webkit:1.15.0"
    testImplementation libs.junit
    testImplementation libs.json
    testImplementation "com.squareup.okhttp3:mockwebserver:4.12.0"
    testImplementation "com.squareup.okhttp3:okhttp-tls:4.12.0"
    testImplementation "org.robolectric:robolectric:4.16"
    testImplementation "androidx.test:core:1.7.0"
}
