// yaran phone app Gradle build: the app, the native core library and Capacitor's plugins.
// `npx cap sync android` (run from mobile/app) rewrites capacitor.settings.gradle and
// app/capacitor.build.gradle; everything yaran-specific lives here and in app/build.gradle.kts.
include ':app'

// The native core is not a Capacitor plugin, so `cap sync` never writes it (Phase 14 item 3).
include ':yaran-core'
project(':yaran-core').projectDir = new File('../plugins/core/android')

// Generated by `cap sync` only when a Cordova plugin exists; included when present.
if (new File(rootDir, 'capacitor-cordova-android-plugins').exists()) {
    include ':capacitor-cordova-android-plugins'
    project(':capacitor-cordova-android-plugins').projectDir = new File('./capacitor-cordova-android-plugins/')
}

apply from: 'capacitor.settings.gradle'
