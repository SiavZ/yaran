# Project-wide Gradle settings for the yaran Android build.

# JVM arguments for the Gradle daemon (AGP plus Kotlin need more than the template's 1.5 GiB).
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8

# AndroidX package structure (required by Capacitor).
android.useAndroidX=true

# Each module's R class holds only its own resources (smaller, faster builds).
android.nonTransitiveRClass=true

kotlin.code.style=official
