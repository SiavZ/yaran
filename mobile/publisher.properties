# Publisher build values for the yaran phone app (Java properties syntax).
#
# Read by mobile/android/app/build.gradle.kts and turned into the iOS xcconfig files by
# `node mobile/scripts/publisher-config.mjs` (run it after any edit; `--check` fails on drift).
# Every value here is public build configuration, never a secret (D5): signing keys and store
# credentials live in CI secrets (Phase 18). Phase 21 fills the real values; Phase 18's
# `check-versions.mjs --publisher` fails a release while a placeholder remains.

# Android applicationId and iOS bundle id. The repo default is a placeholder because inventing a
# domain is forbidden (D16); release builds refuse any id starting with `com.example.`.
# Set by the maintainer (Phase 21).
appId=com.example.yaran

# Apple Developer team id (ten characters) for signing and the app-group keychain. Empty in the
# repo. Set by the maintainer (Phase 21).
appleTeamId=

# The host that receives sign-in callbacks (App Links / associated domains). NEVER hand-edit:
# `publisher-config.mjs` copies it from the repo-root publisher.json (Phase 18's one home for the
# publisher domain); its `<publisher-domain>` placeholder, or no publisher.json at all, writes an
# empty value. Empty means a development build: custom-scheme callback and a warning banner (D8).
publisherDomain=

# Base URL of the push relay this build registers with (Phase 08/16). Empty in the repo, which
# leaves relay-backed push off. Set by the maintainer (Phase 21).
relayUrl=

# How `play` builds deliver push: the values are defined by Phase 16 (empty = Phase 16's default,
# which follows the G5 outcome). Ignored by `foss`.
playPushTransport=

# End-to-end test defaults (Phase 19 hook H6). Read ONLY by the Android `e2e` build type and the
# iOS `E2E` configuration: the shell prefills this org URL and the push plugin uses this relay.
# Release variants never read them. Set by the Phase 19 test harness, never by hand for releases.
e2e.controlPlaneUrl=
e2e.relayUrl=
