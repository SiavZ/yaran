<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
         The yaran phone app shell: the only page in the app with a native bridge (D9).
         Its CSP is pinned by src/csp.test.ts; never weaken it. No network from JS: every
         request goes through the native Session client (D22).
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; img-src 'self' data: blob:; media-src 'self' blob:; style-src 'self' 'unsafe-inline'; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#0a0a0a" />
    <title>yaran</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
