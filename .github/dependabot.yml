# audit02 Phase 24 (P2-2) — automated dependency updates.
#
# Cargo: weekly update PRs for direct + indirect dependencies; patches
# are grouped to reduce noise. Major/minor land as separate PRs so the
# diff is reviewable.
#
# github-actions: weekly SHA-pinned upgrade PRs. Combined with Phase 06's
# `pinact` baseline this means new pins are proposed by Dependabot rather
# than applied by hand.
version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    allow:
      - dependency-type: "direct"
      - dependency-type: "indirect"
    groups:
      patches:
        update-types: ["patch"]

  # "/" covers .github/workflows; the second entry the local composite actions.
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5

  # The React web UI compiled into the binary (crates/yaran-web/web). Added with
  # the workspace: its npm lockfile ships in every release.
  - package-ecosystem: "npm"
    directory: "/crates/yaran-web/web"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      patches:
        update-types: ["patch"]

  # tools/module-headers: the header and 500-line gate run by gates.yml.
  # TypeScript stays on 6.x: TypeScript 7 ships no compiler API, which this tool
  # needs (docs/plans/phoneapp/01-conventions-and-enforcement-tooling.md, Risks).
  # Every new package of the phone-app plan carries the same ignore.
  - package-ecosystem: "npm"
    directory: "/tools/module-headers"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      patches:
        update-types: ["patch"]
    ignore:
      - dependency-name: "typescript"
        versions: [">=7"]

  # The phone-app npm packages (Phase 18): the cloud wire contract (cloud/protocol,
  # whose validators ship inside the Worker, relay and app shell), the org Worker and
  # the push relay, the app shell and its plugins, the shared UI kit and the
  # release-train tooling. One entry for all of them, reviewed like any other
  # supply-chain change. TypeScript stays on 6.x, as above.
  - package-ecosystem: "npm"
    directories:
      - "/cloud/*"
      - "/mobile/app"
      - "/mobile/plugins/*"
      - "/packages/ui-kit"
      - "/tools/release-trains"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      patches:
        update-types: ["patch"]
    ignore:
      - dependency-name: "typescript"
        versions: [">=7"]

  # The Android project (Phase 14). A bump changes dependency hashes, so the
  # maintainer regenerates mobile/android/gradle/verification-metadata.xml on Linux
  # (`--write-verification-metadata sha256` over the Android CI task list) in the same
  # PR and the diff is reviewed, once that file exists.
  - package-ecosystem: "gradle"
    directory: "/mobile/android"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      patches:
        update-types: ["patch"]

  # fastlane and its gems (mobile/Gemfile.lock), which run with store credentials.
  - package-ecosystem: "bundler"
    directory: "/mobile"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      patches:
        update-types: ["patch"]
