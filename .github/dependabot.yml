# audit02 Phase 24 (P2-2) — automated dependency updates.
#
# Cargo: weekly update PRs for direct + indirect dependencies; patches
# are grouped to reduce noise. Major/minor land as separate PRs so the
# diff is reviewable.
#
# github-actions: weekly SHA-pinned upgrade PRs. Combined with Phase 06's
# `pinact` baseline this means new pins are proposed by Dependabot rather
# than applied by hand.
version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    allow:
      - dependency-type: "direct"
      - dependency-type: "indirect"
    groups:
      patches:
        update-types: ["patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5

  # The React web UI compiled into the binary (crates/yaran-web/web). Added with
  # the workspace: its npm lockfile ships in every release.
  - package-ecosystem: "npm"
    directory: "/crates/yaran-web/web"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      patches:
        update-types: ["patch"]

  # tools/module-headers: the header and 500-line gate run by gates.yml.
  # TypeScript stays on 6.x: TypeScript 7 ships no compiler API, which this tool
  # needs (docs/plans/phoneapp/01-conventions-and-enforcement-tooling.md, Risks).
  # Every new package of the phone-app plan carries the same ignore.
  - package-ecosystem: "npm"
    directory: "/tools/module-headers"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      patches:
        update-types: ["patch"]
    ignore:
      - dependency-name: "typescript"
        versions: [">=7"]
