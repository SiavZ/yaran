name: Install script

on:
  pull_request:
    paths:
      - "install.sh"
      - ".github/workflows/install-script-ci.yml"
      - ".github/scripts/test_install_checksum.sh"
      - ".github/scripts/test_install_resolve_version.sh"
  push:
    branches: [main]
    paths:
      - "install.sh"
      - ".github/workflows/install-script-ci.yml"
      - ".github/scripts/test_install_checksum.sh"
      - ".github/scripts/test_install_resolve_version.sh"

concurrency:
  group: install-script-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Offline, no release needed: builds a real archive and drives install.sh's
  # checksum verification through every outcome, including that a mismatch leaves
  # the install directory empty. The `install` job below cannot show that, because
  # it installs a REAL release and so only ever sees the happy path (or, for
  # releases published before checksums existed, the missing-checksum warning).
  verify-checksum-logic:
    name: Checksum verification unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Syntax-check install.sh
        run: bash -n install.sh
      - name: Run checksum verification tests
        run: bash .github/scripts/test_install_checksum.sh
      - name: Run release-tag resolution tests
        run: bash .github/scripts/test_install_resolve_version.sh

  install:
    name: Install ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # install.sh installs this fork's releases (SiavZ/yaran), whose
          # historical tags are dux-amq-vX.Y.Z. dux-amq-v0.1.1 publishes only a combined
          # SHA256SUMS, so this leg exercises the installer's SHA256SUMS fallback
          # against a real release.
          - name: dux-amq-v0.1.1
            version: dux-amq-v0.1.1
          - name: latest
            version: ""

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Run install.sh
        env:
          YARAN_VERSION: ${{ matrix.version }}
        run: |
          set -euo pipefail

          install_dir="$RUNNER_TEMP/yaran-${{ matrix.name }}/bin"
          mkdir -p "$install_dir"

          echo "$install_dir" >> "$GITHUB_PATH"
          export PATH="$install_dir:$PATH"

          YARAN_INSTALL_DIR="$install_dir" bash ./install.sh

          if ! command -v yaran >/dev/null 2>&1; then
            echo "::error::yaran was not found on PATH after install"
            exit 1
          fi

          if [ ! -x "$install_dir/yaran" ]; then
            echo "::error::install.sh did not create an executable yaran binary"
            exit 1
          fi
