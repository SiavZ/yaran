# Android CI leg of mobile-ci.yml: lint, unit and UI tests, license and SBOM gates,
# the FOSS classpath guards, the generated license lists and a reproducibility proof.
#
# Responsibilities: no secrets; builds are unsigned. Release builds take
# -PappIdOverride (14's test-build switch), because 14's release guard refuses the
# repository's com.example placeholder id. App unit tests run as
# :app:testFossDebugUnitTest (the variant 14 wires its build-output inputs to); the
# library modules run testDebugUnitTest, and buildSrc's own tests run with -p buildSrc.
# The jk1 license gate reads the deny.toml allowlist written into
# mobile/android/build/allowed-licenses.json. The unsigned foss APK is built in two
# clean checkouts at different paths and compared with cmp (diffoscope on a mismatch).
# A debug-signed APK must fail the release signer gate. Gradle dependency verification
# metadata is not committed yet (see docs/operations/release-trains.md).
# Uses: .github/actions/android-setup, .github/scripts/check_apk_cert.sh,
# tools/release-trains/license-allowlist.mjs.
name: Mobile Android CI

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Android build and checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/android-setup

      - name: License allowlist for jk1 (from deny.toml)
        run: node tools/release-trains/license-allowlist.mjs --jk1 mobile/android/build/allowed-licenses.json

      # verifyFossDependencies (14) and verifyFossPushClasspath (16) assert that the foss
      # release classpath holds no Firebase, GMS or embedded-FCM artifact.
      - name: Gradle checks and unsigned builds
        working-directory: mobile/android
        run: >-
          ./gradlew --no-daemon -PappIdOverride=io.github.siavz.yaran.ci
          lintFossRelease lintPlayRelease
          :app:testFossDebugUnitTest :yaran-core:testDebugUnitTest
          :yaran-machine-view:testDebugUnitTest :yaran-push:testDebugUnitTest
          :yaran-secure-store:testDebugUnitTest
          ktlintCheck detekt checkLicense cyclonedxBom
          :app:verifyFossDependencies :app:verifyFossPushClasspath
          assembleFossDebug assembleFossRelease bundlePlayRelease

      - name: buildSrc tests (release guards)
        working-directory: mobile/android
        run: ./gradlew --no-daemon -p buildSrc test

      - name: Generated license lists match the dependency tree (Phase 14)
        run: bash mobile/scripts/licenses.sh --check

      - name: The release signer gate refuses a debug-signed APK
        run: |
          set -euo pipefail
          apk="$(find mobile/android/app/build/outputs/apk/foss/debug -name '*.apk' | head -1)"
          test -n "$apk"
          if bash .github/scripts/check_apk_cert.sh "$apk"; then
            echo "check_apk_cert.sh accepted a debug-signed APK" >&2
            exit 1
          fi

  reproducible:
    name: Android reproducibility
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          path: a
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          path: b/elsewhere
      - uses: ./a/.github/actions/android-setup
        with:
          root: a
      - uses: ./a/.github/actions/android-setup
        with:
          root: b/elsewhere
      - name: Build the unsigned foss APK in both checkouts and compare
        run: |
          set -euo pipefail
          for root in a b/elsewhere; do
            (cd "$root/mobile/android" && ./gradlew --no-daemon -PappIdOverride=io.github.siavz.yaran.ci assembleFossRelease)
          done
          first="$(find a/mobile/android/app/build/outputs/apk/foss/release -name '*.apk' | head -1)"
          second="$(find b/elsewhere/mobile/android/app/build/outputs/apk/foss/release -name '*.apk' | head -1)"
          if ! cmp "$first" "$second"; then
            sudo apt-get install -y --no-install-recommends diffoscope-minimal >/dev/null
            diffoscope "$first" "$second" || true
            echo "The foss APK is not reproducible across checkout paths." >&2
            exit 1
          fi

  # Only the native core (:yaran-core) has instrumented tests so far.
  ui-tests:
    name: Android UI tests (API 36 emulator)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/android-setup
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          working-directory: mobile/android
          script: ./gradlew --no-daemon :yaran-core:connectedDebugAndroidTest
