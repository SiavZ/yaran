name: PR

on:
  pull_request:

# Default-deny (audit02 P1-R): these jobs only read source, so a PR from a fork
# cannot use the token for anything else.
permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # The web UI is compiled into the yaran binary, and YARAN_DISABLE_UI_BUILD makes
  # crates/yaran-web/build.rs skip that build entirely. A skipped build also makes
  # the static-serving tests SKIP rather than assert, so with the hatch set every
  # check here could go green on a binary with no web UI. Refuse it outright:
  # anything that builds or tests must run with the frontend build ON.
  #
  # EVERY job below declares `needs: no-ui-build-hatch`, including the ones that
  # do not compile Rust. That is deliberate. CONTRIBUTING.md tells contributors
  # this workflow refuses to run at all with the hatch set, and a guard that
  # several jobs skip past makes that sentence false; the clippy job in particular
  # compiled the crate (and therefore built the frontend) with no guard edge and
  # no declared Node version, so it would have reported green on a hatched build.
  # A blanket edge costs a few seconds of fan-out and keeps the promise exact.
  #
  # Know the LIMIT of this check: it reads the environment of its own job, so it
  # catches a workflow-level `env:` and nothing else. A job-level `env:` or a
  # committed .cargo/config.toml that injects the variable into build scripts is
  # invisible to it, and so is a GitHub repository VARIABLE, which is not exported
  # into the job environment at all and is only reachable through the `vars`
  # context (so it can neither be caught here nor cause the problem in the first
  # place). The gate that inspects the ARTIFACT rather than the configuration is
  # .github/scripts/smoke_archive.sh, which greps the built binary for embedded
  # content-hashed asset names; note that it runs in the RELEASE workflow only, so
  # on a pull request there is no artifact gate and the real coverage here is the
  # static-serving suite, which asserts the same properties with the same graph
  # walk on every PR. Treat this job as the fast, legible failure.
  #
  # YARAN_UI_BUILD_STATE is checked alongside the hatch, belt and braces. build.rs
  # stamps that name on every path it takes and a cargo:rustc-env beats an ambient
  # value, so a set one can no longer talk the suite into skipping; the two
  # retired names could, and are listed so a branch still carrying one is caught.
  no-ui-build-hatch:
    name: Reject YARAN_DISABLE_UI_BUILD
    runs-on: ubuntu-latest
    steps:
      - name: Fail if the frontend-build escape hatch is set
        run: |
          set -euo pipefail
          failed=""
          for name in YARAN_DISABLE_UI_BUILD DUX_DISABLE_UI_BUILD YARAN_UI_BUILD_STATE DUX_UI_BUILD_STATE YARAN_UI_BUILD_SKIPPED DUX_UI_BUILD_SKIPPED YARAN_UI_BUILD_STALE DUX_UI_BUILD_STALE; do
            value="$(printenv "$name" || true)"
            if [ -n "$value" ]; then
              echo "$name is set to '$value' in this workflow's environment. It skips the" >&2
              echo "React build or misreports whether one happened, so the binary could carry" >&2
              echo "no web UI while the static-serving tests skip instead of asserting." >&2
              echo "Remove it." >&2
              failed="yes"
            fi
          done
          [ -z "$failed" ] || exit 1
          echo "OK: no frontend-build escape hatch or state marker is set; the frontend will be built."

  fmt:
    name: Format
    runs-on: ubuntu-latest
    needs: no-ui-build-hatch
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt

      # No Node step: `cargo fmt` parses sources and never runs a build script,
      # so this is the one Rust job that genuinely does not build the frontend.
      - name: Check formatting
        run: cargo fmt --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    # Gated, not merely accompanied. `cargo clippy` COMPILES the crate, so it runs
    # crates/yaran-web/build.rs and builds the frontend exactly as `cargo test`
    # does; without this edge it would happily lint a hatched build and report
    # green, which is the outcome the guard exists to prevent.
    needs: no-ui-build-hatch
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy

      # Node is REQUIRED here for the same reason it is in the test jobs: this job
      # builds the frontend, and a failed frontend build is a hard build failure.
      # The runner image happens to ship Node, which is why this worked while
      # undeclared; relying on that turns an image update into a confusing
      # build-script failure. Same version as every other job so they cannot drift.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: crates/yaran-web/web/package-lock.json

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    # BRANCH-PROTECTION CONTRACT: `Test (ubuntu-24.04)` is a required status
    # check on main (see .github/BRANCH_PROTECTION.md). Upstream names this job
    # `Test`; renaming it back would leave the required context unreported and
    # block every PR. ubuntu-24.04 is what ubuntu-latest resolves to today, so
    # pinning it keeps upstream's behaviour and makes the name true.
    name: Test (ubuntu-24.04)
    runs-on: ubuntu-24.04
    # Gated, not merely accompanied: a sibling job that fails does not stop this
    # one from reporting green, and green-with-no-web-UI is the exact outcome the
    # guard exists to prevent.
    needs: no-ui-build-hatch
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      # Node is REQUIRED here, not incidental: `cargo test` builds yaran-web, whose
      # build script builds the frontend, and a failed frontend build is a hard
      # build failure. test.yml declares this and says it matches pr.yml; it did
      # not, because pr.yml never declared it. Now both do, at the same version.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: crates/yaran-web/web/package-lock.json

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # yaran's own bootstrap commit (adopting a plain folder with init_repo) runs
      # under whatever identity git can see, exactly as it does for a user. A
      # hosted runner has no identity to see, so the test that adopts a plain
      # folder gets git's "unable to auto-detect email" and a deferred 202.
      # yaran-core's rust_and_wrapper_claims_serialize_on_config_lock runs the real
      # yaran-amq/wrappers/claude-amq, which needs flock(1) (util-linux) and jq and
      # skips without them. Both ship on the runner image; installing them here
      # keeps an image change from silently turning that test into a skip.
      - name: Tools the overlay wrapper test runs
        run: sudo apt-get update && sudo apt-get install -y util-linux jq

      - name: Give git the identity a developer's machine has
        run: |
          git config --global user.name "yaran ci"
          git config --global user.email "ci@getdux.app"
      - name: Run tests
        run: cargo test

  web-lint:
    name: Web lint
    runs-on: ubuntu-latest
    # This job runs no Rust and so cannot be fooled by the hatch. It carries the
    # edge anyway so "this workflow refuses to run with YARAN_DISABLE_UI_BUILD set"
    # is true without an exceptions list.
    needs: no-ui-build-hatch
    defaults:
      run:
        working-directory: crates/yaran-web/web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: crates/yaran-web/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  # The frontend build and its unit tests, separate from lint so a lint failure and
  # a build failure are distinguishable at a glance. `cargo build` compiles the
  # frontend too (and now FAILS when it cannot), but that only happens in jobs that
  # build Rust; running `npm run build` here reports the tsc/Vite error directly,
  # and `npm run test` (vitest) covers the pure helpers the Rust side never touches.
  web-build:
    name: Web build and unit tests
    runs-on: ubuntu-latest
    needs: no-ui-build-hatch
    defaults:
      run:
        working-directory: crates/yaran-web/web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: crates/yaran-web/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build the frontend
        run: npm run build

      - name: Run unit tests
        run: npm run test

  dep-isolation:
    name: yaran-web dependency isolation
    runs-on: ubuntu-latest
    # `cargo tree` resolves the graph without compiling, so no build script and no
    # frontend build. Same reasoning as web-lint: the edge keeps the promise in
    # CONTRIBUTING.md exact rather than nearly true.
    needs: no-ui-build-hatch
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # `alacritty_terminal` and `portable-pty` are intentional `yaran-core`
      # deps (the PTY-based provider and the embedded terminal grid both
      # live in the core engine, not the TUI), so they appear in this
      # graph by design and are excluded from the deny-list below.
      - name: Verify yaran-web does not depend on TUI crates
        run: |
          if cargo tree -p yaran-web --edges normal,build,dev 2>&1 | grep -E '\b(yaran-tui|ratatui|crossterm|crokey)\b'; then
            echo "FAIL: yaran-web pulled in a TUI-only dependency" >&2
            exit 1
          fi
          echo "OK: yaran-web dependency graph is TUI-free"

  # The macOS half of the platform-split code (file drops read /proc on Linux
  # and different plumbing on macOS; the process-scan tests are Linux-gated) is
  # INVISIBLE to the Ubuntu jobs: cfg(target_os) hides it from their compile
  # entirely. Three macOS-only warnings and a macOS test-compile break shipped
  # that way and were found by hand on a maintainer machine. This job is the
  # "never again": clippy with --all-targets compiles the test code too, so
  # both classes fail here, and cargo test then actually EXERCISES the macOS
  # arms that otherwise run on a maintainer laptop or nowhere. One job, two
  # steps, so the compile cache is warmed once on the slower runner.
  clippy-test-macos:
    # BRANCH-PROTECTION CONTRACT: `Test (macos-14)` is a required status check
    # on main (see .github/BRANCH_PROTECTION.md), so this job carries that name
    # even though it runs on macos-latest as upstream does: it has not been
    # proven on a macos-14 runner, and pinning an unverified image would risk
    # the one required macOS gate. Upstream calls it `Clippy and test (macOS)`;
    # do not take that name back in an upstream merge. It runs clippy and then
    # the full test suite on macOS (the platform-specific arms run nowhere
    # else).
    name: Test (macos-14)
    runs-on: macos-latest
    needs: no-ui-build-hatch
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy

      # Node for the frontend build, same reasoning and version as every other
      # Rust job: clippy and cargo test both run crates/yaran-web/build.rs.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: crates/yaran-web/web/package-lock.json

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      # The macOS suite runs the same tests the Ubuntu jobs do plus the
      # platform-specific arms. A git identity is needed for the same reason the
      # Ubuntu job needs one: the bootstrap-commit tests shell out to git, and a
      # hosted runner has no user configured for them to pick up.
      - name: Give git the identity a developer's machine has
        run: |
          git config --global user.name "yaran ci"
          git config --global user.email "ci@getdux.app"
      - name: Run tests
        run: cargo test --all-features

  # Supply-chain gate (audit02 P0-I, audit03 P1-13), carried over from this
  # fork's pre-workspace CI. `cargo audit --deny warnings` fails on any RUSTSEC
  # entry not explicitly ignored; `cargo deny check` enforces deny.toml (yanked
  # crates, license allowlist, duplicate versions, crates.io-only sources).
  # Mirrored in test.yml so a direct push is gated too. Keep both in sync.
  # `cargo audit` and `cargo deny` resolve the graph without building, so no
  # build script runs and the hatch cannot affect them; the edge is kept for the
  # same "the whole workflow refuses" promise as web-lint.
  security:
    name: Security
    runs-on: ubuntu-latest
    needs: no-ui-build-hatch
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      # Pinned to reviewed versions (audit03 P1-10).
      - name: Install cargo-audit and cargo-deny
        run: |
          cargo install --locked cargo-audit --version 0.22.2
          cargo install --locked cargo-deny --version 0.20.2

      - name: cargo audit
        # Keep --ignore in sync with deny.toml [advisories].ignore: cargo-audit
        # does not read deny.toml. Both are unmaintained warnings with no patched
        # version and no upstream replacement yet: bincode arrives through
        # syntect and instant through notify. Reviewed 2026-07-11; review again
        # by 2026-08-01 and drop each ignore once its parent crate migrates.
        run: |
          cargo audit --deny warnings \
            --ignore RUSTSEC-2025-0141 \
            --ignore RUSTSEC-2024-0384

      - name: cargo deny check
        run: cargo deny --all-features check

  # The workspace declares rust-version = "1.89" (its MSRV; rusqlite 0.41, the
  # first on a libsqlite3-sys clear of RUSTSEC-2026-0459, needs 1.89). Every other job
  # uses the latest stable, so without this one nothing notices a change that
  # needs a newer compiler until a user on 1.89 cannot build.
  msrv:
    name: MSRV (1.89)
    runs-on: ubuntu-latest
    needs: no-ui-build-hatch
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: "1.89.0"

      # cargo check runs crates/yaran-web/build.rs, which builds the frontend.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: crates/yaran-web/web/package-lock.json

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: msrv

      - name: cargo check on the MSRV
        run: cargo +1.89.0 check --workspace --all-targets --locked
